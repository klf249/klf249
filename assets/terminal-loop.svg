<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="t d"><title id="t">Animated developer terminal</title><desc id="d">A looping terminal animation showing product, backend, realtime and release work.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102c4b"/></linearGradient><linearGradient id="line" x1="0" x2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><rect width="1200" height="250" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="248" rx="21" fill="none" stroke="#7dd3fc" stroke-opacity=".16"/><g transform="translate(26 22)"><circle cx="0" cy="0" r="5" fill="#fb7185"/><circle cx="18" cy="0" r="5" fill="#facc15"/><circle cx="36" cy="0" r="5" fill="#34d399"/><text x="64" y="5" fill="#9cc7e8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">walker@build:~</text></g><g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17"><text x="40" y="78" fill="#7dd3fc">$</text><text x="64" y="78" fill="#e5f2ff">ship --target product</text><text x="64" y="108" fill="#94a3b8">✓ mobile + web interface</text><text x="64" y="136" fill="#94a3b8">✓ Go API + PostgreSQL + Redis</text><text x="64" y="164" fill="#94a3b8">✓ realtime + voice + notifications</text><text x="64" y="192" fill="#94a3b8">✓ release + infrastructure + validation</text><text x="40" y="224" fill="#7dd3fc">$</text><text x="64" y="224" fill="#e5f2ff">status</text></g><rect x="130" y="211" width="10" height="19" rx="2" fill="#93c5fd"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect><g transform="translate(870 44)"><circle cx="120" cy="82" r="58" fill="none" stroke="#2f80ed" stroke-opacity=".18" stroke-width="18"/><circle cx="120" cy="82" r="58" fill="none" stroke="url(#line)" stroke-width="18" stroke-linecap="round" stroke-dasharray="250 365"><animateTransform attributeName="transform" type="rotate" from="0 120 82" to="360 120 82" dur="8s" repeatCount="indefinite"/></circle><circle cx="120" cy="82" r="92" fill="none" stroke="#7dd3fc" stroke-opacity=".15" stroke-dasharray="4 10"><animateTransform attributeName="transform" type="rotate" from="360 120 82" to="0 120 82" dur="16s" repeatCount="indefinite"/></circle><text x="120" y="78" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">BUILD</text><text x="120" y="100" text-anchor="middle" fill="#8cc8ff" font-family="Inter,Arial,sans-serif" font-size="13">IN MOTION</text></g></svg>
