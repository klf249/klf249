<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="34" viewBox="0 0 1200 34" role="img" aria-label="Animated blue divider">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0ea5e9" stop-opacity="0"/><stop offset="0.5" stop-color="#60a5fa"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></linearGradient>
  </defs>
  <rect x="90" y="16" width="1020" height="1" fill="#60a5fa" opacity="0.12"/>
