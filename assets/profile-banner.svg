<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">Walker — Full-Stack Developer and Product Builder</title><desc id="desc">Animated dark blue developer banner.</desc>
