    <text x="0" y="72" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="700" letter-spacing="-1">Walker</text>
    <text x="2" y="114" fill="#a9c5df" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500">Founder · Full-Stack Developer · Product Builder</text>
    <text x="2" y="158" fill="#7ea6c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Mobile · Web · Backend · Real-time · Infrastructure</text>
