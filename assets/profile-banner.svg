<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Walker — Founder and Full-Stack Developer</title>
  <desc id="desc">A dark blue developer profile banner with subtle geometric details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="48%" stop-color="#0b1b33"/>
      <stop offset="100%" stop-color="#123b67"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="34%" r="60%">
      <stop offset="0%" stop-color="#55b8ff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#55b8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#8cc8ff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="28" fill="url(#glow)"/>
  <circle cx="1032" cy="74" r="84" fill="#2f80ed" opacity="0.14" filter="url(#blur)"/>
  <circle cx="1108" cy="246" r="106" fill="#38bdf8" opacity="0.10" filter="url(#blur)"/>
  <g opacity="0.24" fill="none" stroke="#86c8ff">
    <path d="M885 84h128l54 54-54 54H885l-54-54z"/>
    <path d="M955 112h86l34 34-34 34h-86l-34-34z"/>
    <circle cx="1080" cy="96" r="7" fill="#86c8ff" stroke="none"/>
    <circle cx="852" cy="224" r="5" fill="#86c8ff" stroke="none"/>
  </g>
  <g transform="translate(76,72)">
